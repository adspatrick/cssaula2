<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Pop Art / Neo-Brutalista</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <h1 class="titulo-profissional">DESIGN POP ART</h1>

    <div class="imagem-container">
        <img src="pop.png" alt="Imagem Estilizada">
    </div>

    <div class="texto-container">
        <p class="texto-premium" id="texto-para-alterar">
            Este é o layout completo combinando cores vibrantes e alto contraste. 
            O título usa sombras em camadas, a imagem possui um filtro automático 
            que aumenta a saturação para torná-la mais viva e o container de texto 
            possui uma trava para exibir exatamente 5 linhas.
        </p>
    
        <button class="botao-pop" onclick="alterarTexto()">CLIQUE AQUI</button>
    </div>

    
</body>
</html>
